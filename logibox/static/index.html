<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOGIBOX</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1b1f2a;--mut:#566073;--line:#dfe3ea;--acc:#1f3fd1;--navy:#14213d;--warn:#fff3d6;--warnt:#7a4b00;--ok:#e3f4e8;--okt:#17602e;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans JP","Yu Gothic UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
nav{background:var(--navy);display:flex;gap:4px;padding:8px 10px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
nav a{color:#cfd6e6;text-decoration:none;padding:9px 14px;border-radius:8px;font-size:14px}nav a.on{background:#2b3f73;color:#fff}nav .sp{flex:1}
main{max-width:1000px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
input,select,textarea{font:inherit;padding:10px;border:1px solid #c5ccd8;border-radius:8px;background:#fff;color:var(--ink);min-height:42px;width:100%}
button{font:inherit;padding:10px 16px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer;min-height:42px}
button.s{background:#fff;color:var(--acc)}button.d{background:#fff;color:var(--bad);border-color:var(--bad)}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eef0f4;font-size:14px;align-items:center}
.row:last-child{border:0}.m{color:var(--mut);font-size:12px}.n{font-size:22px;font-weight:700}
.t{font-size:11px;padding:2px 8px;border-radius:99px;background:#e8edff;color:var(--acc);white-space:nowrap}.t.w{background:var(--warn);color:var(--warnt)}.t.g{background:var(--ok);color:var(--okt)}
#nf fieldset{padding:0;border:0;margin:0;min-width:0}
#nf .case-warning{color:var(--bad)}#nf button:disabled{opacity:.55;cursor:default}
#nf p:empty{display:none}
.case-maker{grid-column:1 / -1;min-width:0}
#n_maker,#c_maker{field-sizing:content;min-height:72px;resize:vertical}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.big{font-weight:700}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1b1f2a;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9;max-width:90%}
#toast.bad{background:var(--bad)}a.case{color:inherit;text-decoration:none}
.login{max-width:360px;margin:60px auto}.pad{overflow-x:auto}
.purchase-entry{padding:4px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px;min-width:0}
.purchase-entry h3,.invoice-detail h3{font-size:14px;margin:12px 0 6px}
.purchase-doc{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:5px 0;font-size:13px}
.purchase-doc .doc-name{overflow-wrap:anywhere;min-width:0;max-width:100%}
.purchase-doc button,.purchase-doc a,.doc-tool{font-size:13px;min-height:32px;padding:5px 9px}
.doc-tool{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;color:var(--acc);text-decoration:none;background:white}
.purchase-tools,.invoice-detail{background:#f7f9fe}
.purchase-fields{margin-top:8px}
.invoice-detail{margin-top:12px}
.invoice-items{border-collapse:collapse;width:100%;min-width:720px;text-align:left}
.invoice-items th,.invoice-items td{padding:4px;font-size:13px}
.invoice-items input{min-width:72px}.invoice-items td:first-child input{min-width:165px}
#purchase_read_result p{margin:8px 0}
.purchase-warning{color:var(--bad)}
#purchase_section button:disabled,.doc-dialog button:disabled{opacity:.55;cursor:default}
.doc-dialog{border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--ink);max-width:calc(100% - 20px);width:520px}
.doc-dialog::backdrop{background:#14213d9e}
.doc-dialog h2{overflow-wrap:anywhere}
.doc-preview{width:min(1080px,calc(100% - 20px));height:min(880px,calc(100% - 20px));overflow:hidden}
.doc-preview[open]{display:flex;flex-direction:column;gap:8px}
.doc-preview .acts{margin:0;align-items:center}
.preview-controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.preview-status:empty{display:none}
.preview-scroll{overflow:auto;background:#e8edf6;border:1px solid var(--line);border-radius:8px;flex:1;min-height:0}
.preview-image{display:block;width:100%;margin:0 auto}
.preview-image:not([src]){display:none}
#document_form button:disabled{opacity:.55;cursor:default}
#document_item_names{field-sizing:content;min-height:100px;resize:vertical}
@media(max-width:600px){main{padding:10px}.row{flex-wrap:wrap}}
/* TOMOS-style navigation and case editor */
#app.workspace{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.workspace aside{position:sticky;top:0;align-self:start;height:100dvh;overflow:auto;background:var(--navy);padding:20px 14px;color:white}
.brand{font-weight:700;font-size:17px;padding:8px 10px 16px}
.version{display:block;color:#c4cfdf;font-size:12px;margin-top:8px}
.workspace article a{color:#253858;text-decoration:none;font-weight:600}
.workspace article a:hover{text-decoration:underline}
.workspace nav{position:static;display:grid;padding:0;gap:3px;background:transparent}
.workspace nav a{display:flex;align-items:center;gap:10px;min-height:43px}
.workspace nav a:hover{background:#26395f}
.workspace nav a.on{background:#314d84;box-shadow:inset 3px 0 #8bafff}
.workspace nav svg{width:20px;height:20px;flex:none}
.workspace main{width:100%;max-width:1440px}
.logout{margin:16px 0 0;background:transparent;border-color:#526686}
.mobile-nav{display:none}
.table-scroll{overflow:auto}
.data-table{border-collapse:collapse;width:100%;text-align:left}
.data-table th,.data-table td{padding:12px 10px;border-bottom:1px solid var(--line)}
.data-table th{background:#edf1f8;white-space:nowrap}
.amount{font-variant-numeric:tabular-nums;white-space:nowrap}
.workspace article .amount{white-space:normal;overflow-wrap:anywhere}
.filter-bar{display:grid;grid-template-columns:minmax(0,2fr) minmax(120px,1fr);gap:10px;margin-bottom:12px}
#case-editor{width:min(1100px,96vw);max-width:none;max-height:94dvh;padding:0;border:1px solid var(--line);border-radius:14px;color:var(--ink);background:var(--bg)}
#case-editor[open]{display:flex;flex-direction:column}
#case-editor::backdrop{background:#101c38a6}
dialog .modal-toast{position:sticky;bottom:0;margin:0;padding:10px 16px;background:var(--ok);color:var(--okt);z-index:4}
dialog .modal-toast.bad{background:#fff0ed;color:var(--bad)}
.editor-head{background:white;padding:14px 20px;border-bottom:1px solid var(--line)}
.editor-title{display:flex;justify-content:space-between;align-items:start;gap:12px}
.editor-tabs{display:flex;flex-wrap:wrap;gap:6px}
.editor-tabs button{background:white;color:var(--acc);border-color:var(--line)}
.editor-tabs [aria-selected=true]{background:#e3eafd;border-color:#aebee4;color:#163b98}
.editor-body{overflow:auto;padding:16px 20px}
.editor-body [hidden]{display:none}
.editor-panel{min-width:0}
.editor-body .card{min-width:0}
.settlement-dialog{width:min(920px,96vw);max-height:94dvh;padding:0;background:var(--bg)}
.settlement-dialog[open]{display:flex;flex-direction:column}
@media(max-width:720px){
 #app.workspace{display:block}.workspace aside{height:auto;z-index:5;padding:8px 12px}
 .mobile-nav{display:inline-block;background:transparent;border-color:#526686}.brand{display:inline-block;padding:8px 10px}
 .workspace aside:not(.expanded) nav,.workspace aside:not(.expanded) .logout{display:none}
 .workspace nav{grid-template-columns:repeat(2,minmax(0,1fr))}
 .editor-head,.editor-body{padding:10px}
 .editor-tabs button{padding:6px 9px;min-height:38px}
 .data-table td,.data-table th{padding:8px}.filter-bar{grid-template-columns:1fr}
}
.settings-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.settings-tabs button{background:transparent;color:var(--mut);border-color:transparent}
.settings-tabs button[aria-selected=true]{background:#e3eafd;color:#183e91;border-color:#bccce9;font-weight:700}
/* Typography and spacing inherited from TOMOS ver.2.48.8. */
:root{--bg:#f3f5f9;--ink:#1b2a41;--mut:#566176;--line:#dde3ec;--acc:#1d4ed8;--navy:#16233a}
body{font-family:'Yu Gothic UI',Meiryo,sans-serif;font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit}
button{font-weight:600;min-height:46px;padding:12px 20px;border-radius:9px}
button.s{border-color:var(--line)}
input,select,textarea{font-size:15px;padding:12px 14px;background:#fbfcfe;border-color:var(--line)}
input:focus,select:focus,textarea:focus{outline:2px solid #a7c5ff;outline-offset:1px}
.workspace h1{font-size:20px;line-height:1.4;margin:0 0 12px}
h2{font-size:17px;line-height:1.4}
h3{font-size:17px}
.f{font-size:14px;font-weight:600;color:var(--mut)}
.f input,.f textarea,.f select{font-weight:400}
.m{font-size:13px}
.row{font-size:15px;padding:10px 0}
.t{font-size:13px;border-radius:5px;padding:4px 9px}
.n{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums}
.workspace nav a{font-size:16px;font-weight:600;color:#a9b8d0;padding:10px 12px;min-height:46px}
.workspace nav a.on{background:#2a3b5a;color:white}
.brand{display:block;font-size:19px;letter-spacing:1px;padding-bottom:24px}
.workspace main{padding:clamp(14px,2.5vh,26px) clamp(14px,2.1vw,32px)}
.card{padding:24px;border-radius:13px;margin-bottom:20px}
.g{gap:18px}
.data-table th{font-size:14px;background:#f1f6f8;color:var(--mut)}
.data-table td{font-size:15px;padding:12px 10px}
@media(max-width:720px){
 .workspace h1{font-size:18px}
 .brand{display:inline-block;padding:8px 10px;font-size:17px}
 .card{padding:16px}
 .workspace nav a{font-size:14px}.row{flex-wrap:wrap}
}

/* LOGIBOX navigation */
.workspace aside{background:linear-gradient(165deg,#061d38 0%,#092747 55%,#071c34 100%);padding:clamp(14px,3vh,26px) 16px;box-shadow:4px 0 24px #071c3410}
.workspace .brand{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0 22px;color:#fff;text-decoration:none;line-height:1.2}
.brand img{width:68px;height:74px}.brand span{font-size:30px;letter-spacing:3px;font-weight:750}.brand small{font-size:12px;color:#afc4de;letter-spacing:.5px;font-weight:400}
.workspace nav{gap:8px}.workspace nav a{position:relative;min-height:46px;padding:9px 28px 9px 12px;border:1px solid #244a70;border-radius:11px;background:linear-gradient(110deg,#143b64,#0e3055);color:#e7f1ff;font-size:14px;font-weight:650;box-shadow:0 5px 14px #00102225;transition:background .15s,transform .15s}
.workspace nav a::after{content:'›';position:absolute;right:12px;font-size:25px;font-weight:400}.workspace nav a.on{background:linear-gradient(110deg,#008aff,#0872ef);border-color:#2298ff;box-shadow:0 6px 18px #0079ff30;color:white}
.workspace nav a:hover{transform:translateX(2px);filter:brightness(1.12)}.workspace nav a:focus-visible{outline:3px solid #91cfff;outline-offset:3px}
.workspace .logout{margin-top:12px;min-height:38px;padding:6px 12px;border-color:#375675;color:#c6d9ee;border-radius:9px;background:transparent;font-size:14px}.workspace .version{color:#9eb7d2;padding:4px 5px}
@media(max-width:720px){.workspace aside{padding:10px 14px}.workspace .brand{display:inline-flex;flex-direction:row;gap:10px;padding:0;margin-right:12px;vertical-align:middle}.brand img{width:28px;height:32px}.brand span{font-size:20px;letter-spacing:2px}.brand small{display:none}.workspace .mobile-nav{float:right;padding:6px 12px;min-height:36px}.workspace nav{clear:both;padding-top:16px}.workspace nav a{min-height:48px}.workspace .logout{margin-top:12px}}

.auth-screen{min-height:100dvh;display:grid;place-items:center;padding:32px 20px;background:linear-gradient(120deg,#17253b,#283955);color:#172b48}
.auth-card{width:min(100%,470px);max-width:470px;margin:0;padding:50px 46px 54px;border-radius:15px;background:#fbfcfe;box-shadow:0 18px 60px #09162928}
.auth-brand{font-size:32px;letter-spacing:4px;font-weight:700;margin-bottom:42px;line-height:1.3}.auth-brand span{color:#a9c6ff}
.auth-card h1{font-size:26px;margin:0 0 14px;font-weight:700}.auth-intro{font-size:14px;color:#526b8c;margin:0 0 28px;line-height:1.8}
.auth-card .f{font-size:14px;gap:8px}.auth-card input{background:#e9f0fd;min-height:52px;border:1px solid #d8e0ed;border-radius:9px;padding:12px 14px}
.auth-card button{width:100%;min-height:51px;margin-top:18px;border-radius:9px;background:#2148e0;border-color:#2148e0;font-weight:700}
.auth-card input:focus-visible,.auth-card button:focus-visible{outline:3px solid #91b7ff;outline-offset:3px}
@media(max-width:520px){.auth-screen{padding:24px 16px}.auth-card{padding:34px 26px 38px}.auth-brand{font-size:29px;margin-bottom:30px}.auth-card h1{font-size:24px}}

.case-info-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;background:#e4ebfc;border:1px solid #d8e2f6;border-radius:12px;padding:14px 18px;margin:16px 0}
.case-info-strip span{display:block;color:#65738c;font-size:12px;margin-bottom:6px}.case-info-strip strong{font-size:15px;overflow-wrap:anywhere}
.sub-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px;padding-bottom:12px;border-bottom:1px solid #d8e2f6}
.sub-tabs button{background:white;color:#203657;border:1px solid #d8e2f6}.sub-tabs button[aria-selected="true"]{background:#e2eaff;color:#2148d7;border-color:#b7c9f4}
.sub-slot .sub-input-summary{background:#edf3ff;border:1px solid #d8e4f8;border-radius:12px;padding:18px;margin-bottom:20px}.sub-slot>.row{background:#f2f6ff}
@media(max-width:720px){.case-info-strip{grid-template-columns:repeat(2,minmax(0,1fr));padding:10px;gap:8px}.case-info-strip strong{font-size:13px}.sub-slot .sub-input-summary{padding:12px}}

.dashboard-view,.exports-page,.settings-page{--panel-gap:12px;--panel-pad:16px;min-width:0}
.dashboard-view,.dash-top,.dash-middle,.exports-grid{display:grid;gap:var(--panel-gap)}
.dashboard-view h1{margin:0}
.dashboard-view .card,.exports-page .card,.settings-page .card{
 padding:var(--panel-pad);margin:0;min-width:0;border-radius:12px
}
.dash-top{grid-template-columns:repeat(4,minmax(0,1fr))}
.dash-top h2{font-size:14px;margin-bottom:4px}
.dash-middle{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.dash-money{font-size:24px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.dash-note,.dashboard-view small{display:block;font-size:12px;color:var(--mut);line-height:1.45}
.dash-note{margin:5px 0 0}
.dashboard-view a,.deadline-list a{color:var(--acc);text-decoration:none}
.dashboard-view a:hover,.deadline-list a:hover{text-decoration:underline}
.dash-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px}
.dash-metric{display:grid;align-content:start;gap:3px;padding:8px 12px;border-radius:8px;background:#edf3ff}
.dash-metric + .dash-metric{background:#f3f6fb}
.dash-metric span,.dash-metric a,.dash-profit-row span{font-size:13px;color:var(--mut)}
.dash-metric a{color:var(--acc)}
.dash-partner-list{margin-top:5px}
.dash-partner,.dash-profit-row,.dash-task{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto);align-items:center;gap:8px 12px;padding:5px 0;border-bottom:1px solid #e5ebf3}
.dash-partner:last-child,.dash-task:last-child{border-bottom:0}
.dash-partner>span,.dash-task a{overflow-wrap:anywhere}
.dash-partner strong,.dash-profit-row strong{text-align:right;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.dash-partner{display:block;padding:12px 0;font-size:15px}
.dash-partner-name{display:block;font-size:16px;font-weight:700;margin-bottom:8px;overflow-wrap:anywhere}
.dashboard-view .dash-partner-name small{font-size:14px;font-weight:400;margin-top:3px}
.dash-partner dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:baseline}
.dash-partner dt,.dash-partner dd{margin:0}
.dash-partner dd{text-align:right;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.dash-partner .principal-available{color:#1764bf;font-weight:700}
.dash-profit-row{padding:6px 0}
.dash-progress-title{font-size:13px;margin:10px 0 5px;color:var(--mut)}
.dash-progress{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;margin:0}
.dash-progress>div{display:flex;justify-content:space-between;gap:4px 8px;flex-wrap:wrap;background:#f3f6fb;padding:4px 8px;border-radius:6px;font-size:13px}
.dash-progress dd{margin:0;font-weight:700}
.section-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;margin-bottom:8px}
.workspace .section-head h1,.section-head h2{margin:0}
.section-head a{font-size:13px}
.dash-tasks{list-style:none;margin:0;padding:0}
.dash-task{min-height:36px}
.dash-deadline{font-size:13px;color:#52647b;padding:2px 8px;border-radius:6px;background:#f0f3f8}
.dash-deadline.overdue{color:#a33b17;background:#fff0e5;font-weight:650}
.pager{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:6px 10px;margin-top:8px}
.pager button,.settings-page button,.exports-page button,.case-list .purchase-tools button{
 min-height:38px;padding:6px 12px;font-size:14px;line-height:1.4
}
.pager[hidden]{display:none}
.pager button[aria-disabled="true"]{opacity:.5;cursor:default}
.pager output{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.compact-table th,.compact-table td{padding:7px 10px}
.compact-table td:first-child{overflow-wrap:anywhere}
.case-list .card{padding:14px 16px}
.case-list .filter-bar{margin-bottom:8px}
.case-list .list-trash{margin:0}
.case-list .case-actions{align-items:center;margin:0 0 10px}
.case-list .purchase-tools{display:flex;align-items:end;flex-wrap:wrap;gap:6px 14px;margin-bottom:10px}
.case-list .purchase-tools h2{flex-basis:100%;margin:0}
.case-list .purchase-tools .acts{margin:0}
.case-list .purchase-tools input{padding:6px 9px;min-height:38px}
.settings-page [hidden]{display:none!important}
.settings-page .g,.company-summary,.exports-page .g{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 20px
}
.company-summary{margin:0;gap:0 24px}
.company-summary>div{
 display:grid;grid-template-columns:minmax(105px,1fr) minmax(0,2fr);gap:4px 12px;
 padding:9px 0;border-bottom:1px solid #e5ebf3;align-items:baseline
}
.company-summary dt{font-size:13px;color:var(--mut)}
.company-summary dd{margin:0;font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap}
.settings-page .f,.exports-page .f{gap:4px;min-width:0}
.settings-page :is(input,select,textarea),.exports-page :is(input,select){
 font-size:14px;padding:7px 10px;min-height:38px;min-width:0

.settings-page .acts,.exports-page .acts{margin-top:12px}
.settings-page p,.settings-page .section-head{margin-top:0}
.settings-page .table-scroll{margin-top:8px}
.settings-page .sub-editor{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.settings-page details{align-self:center;font-size:14px}
.settings-page details button{margin-top:6px}
.company-seal{display:flex;align-items:center;gap:10px 14px;margin-top:12px}
.company-seal img{width:64px;height:64px;object-fit:contain}
.company-seal h3,.company-seal p{margin:0}
.exports-grid{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.exports-page .export-evidence{grid-column:1 / -1;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:6px 12px}
.export-evidence h2{grid-column:1 / -1;margin-bottom:2px}
.export-evidence .acts{margin:0}

 .dashboard-view,.settings-page,.exports-page{--panel-pad:14px;--panel-gap:10px}
 .dash-task{min-height:32px}
 .company-summary>div{padding:7px 0}
}
@media(max-height:780px) and (min-width:1101px){

@media(max-width:1100px){
 .dash-top{grid-template-columns:repeat(2,minmax(0,1fr))}
 .exports-page .export-evidence{grid-template-columns:minmax(0,1fr)}
 .exports-page .export-evidence .acts{margin-top:4px}

function toast(m,bad){

function paginate(content,pager,perPage,render,label){
 pager.innerHTML='<button class="s" type="button">前へ</button><output></output><button class="s" type="button">次へ</button>';
 pager.setAttribute('role','group');
 pager.setAttribute('aria-label',label+'のページ切り替え');
 const [previous,status,next]=pager.children;
 let items=[],index=0;
 function update(){
  const count=Math.ceil(items.length/perPage), start=index*perPage, end=Math.min(start+perPage,items.length);
  content.innerHTML=render(items.slice(start,end));
  pager.hidden=count<2;
  previous.setAttribute('aria-disabled',String(index===0));
  next.setAttribute('aria-disabled',String(index>=count-1));
  status.textContent=count?`${start+1}〜${end}件 / 全${items.length}件（${index+1}/${count}ページ）`:'';
 }
 previous.onclick=()=>{if(index>0){index--;update()}};
 next.onclick=()=>{if((index+1)*perPage<items.length){index++;update()}};
 return entries=>{items=entries;index=0;update()};
}

let createdCaseNotice=null;

 if(form.querySelector('#case_submit').disabled) return;

 const controls = form.querySelector('fieldset');

 controls.disabled = true;
 error.textContent = '';
 try {
  const result = await api('POST','/api/cases',fields);
  if(!form.isConnected) return;
  createdCaseNotice={id:result.id,number:result.mgmt_no};
  location.hash = '#/case/'+result.id+'/purchase';
 } catch(e) {
  if(e.message!=='auth'){
   const duplicate = form.querySelector('#case_duplicate');
   if(duplicate.textContent !== e.message) error.textContent = e.message;
  }
 } finally {
  controls.disabled = false;
 }
}

function openCaseEditor(active,title,markup){
 const tabs=[['basic','基本'],['purchase','仕入'],['sub','下請け'],['haak','ハーク請求'],['docs','帳票']];
 const template=document.createElement('template');
 template.innerHTML=markup;
 const items=[...template.content.children];
 const purchase=items.findIndex(x=>x.id==='purchase_section');
 const haak=items.findIndex(x=>x.querySelector('#h_amt'));
 const docs=items.findIndex(x=>x.querySelector('#doc_extra'));
 const ranges=[0,purchase,purchase+1,haak,docs,items.length-1];
 let dialog=$('#case-editor');
 const fresh=!dialog;
 if(fresh){
  const returnView=$('.deadline-list')?'#/deadlines':$('nav a.on')?.getAttribute('href')||'#/cases';
  const returnHash=returnView==='#/monthly'&&monthly?returnView+'?'+monthly.period:returnView;
  page(returnView,`<h1>${menu.find(x=>x[0]===returnView)[1]}</h1><a href="${returnView}">一覧に戻る</a>`);
  dialog=document.createElement('dialog');
  dialog.id='case-editor';
  dialog.setAttribute('aria-labelledby','case-title');
  dialog.addEventListener('close',()=>{dialog.remove();if(/^#\/case\//.test(location.hash))location.hash=returnHash});
  document.body.append(dialog);
 }
 dialog.innerHTML=`<header class="editor-head"><div class="editor-title"><h1 id="case-title">${title}</h1><button class="s" type="button" onclick="$('#case-editor').close()">閉じる</button></div><div class="editor-tabs" role="tablist" aria-label="案件編集">${tabs.map(([key,label])=>`<button type="button" role="tab" id="tab-${key}" aria-controls="panel-${key}" onclick="selectCaseTab('${key}')">${label}</button>`).join('')}</div></header><div class="editor-body"></div>`;
 tabs.forEach(([key],index)=>{
  const panel=document.createElement('section');
  panel.id='panel-'+key;
  panel.setAttribute('role','tabpanel');
  panel.setAttribute('aria-labelledby','tab-'+key);
  panel.append(...items.slice(ranges[index],ranges[index+1]));
  if(key==='basic')panel.append(items.at(-1));
  dialog.querySelector('.editor-body').append(panel);
 });
 dialog.querySelector('.editor-tabs').onkeydown=event=>{
  const index=tabs.findIndex(([key])=>event.target.id==='tab-'+key);
  const offsets={ArrowLeft:(index+tabs.length-1)%tabs.length,ArrowRight:(index+1)%tabs.length,Home:0,End:tabs.length-1};
  if(index<0||!(event.key in offsets))return;
  event.preventDefault();
  const key=tabs[offsets[event.key]][0];
  selectCaseTab(key);
  $('#tab-'+key).focus();
 };
 simplifyCaseEditor();
 for(const slot of [1,2])fundingTotals(slot);
 selectCaseTab(active);
 if(fresh)dialog.showModal();
 if(createdCaseNotice?.id===CUR.v.case.id){
  toast('管理番号 '+createdCaseNotice.number+' で登録しました。続けて仕入請求書を登録できます');
  createdCaseNotice=null;
 }
}
function selectCaseTab(tab){
 CUR.tab=tab;
 const dialog=$('#case-editor');
 for(const panel of dialog.querySelectorAll('.editor-body > [role="tabpanel"]'))panel.hidden=panel.id!=='panel-'+tab;
 for(const button of dialog.querySelectorAll('.editor-tabs [role="tab"]')){
  const selected=button.id==='tab-'+tab;
  button.setAttribute('aria-selected',String(selected));
  button.tabIndex=selected?0:-1;
 }
 dialog.querySelector('.editor-body').scrollTop=0;
}

function updatePurchasePayment(){
 const amount=Number(G('p_amt').replace(/,/g,'')), paid=Number(G('p_paid').replace(/,/g,''));
 const out=$('#purchase_payment_summary');if(!out)return;
 if(!Number.isFinite(amount)||!Number.isFinite(paid)||paid<0){out.textContent='金額を確認してください';return}
 const balance=amount-paid;
 const status=paid===0?'未払い':balance>0?'一部支払い済み':balance===0?'全額支払い済み':'支払額が請求額を超えています';
 out.textContent=`${status}　｜　支払済み ${Y(paid)}　／　残り ${Y(Math.max(0,balance))}${paid>0&&!G('p_pd')?'　※ 支払日を入力してください':''}`;
}

 const others=files.filter(file=>file.kind!=='purchase_invoice');
 const current=invoices.length?[invoices[0],...others]:others;

async function showDocumentPreview({title,url,pdf=true,download,closeLabel='閉じる',onReady}){
 const dialog=openDocDialog('doc-preview',`<h2 id="doc_dialog_title">${esc(title)}</h2>
  <div class="acts">
   <button type="button" class="s" data-close autofocus>${esc(closeLabel)}</button>
   ${download?`<a class="doc-tool" href="${download}" download>ダウンロード</a>`:''}
   <div class="preview-controls"><button type="button" class="s" data-out aria-label="縮小">−</button><output data-zoom>100%</output><button type="button" class="s" data-in aria-label="拡大">＋</button></div>
   ${pdf?`<div class="preview-controls"><button type="button" class="s" data-prev disabled>前のページ</button><output data-page>―</output><button type="button" class="s" data-next disabled>次のページ</button></div>`:''}
  </div><p class="preview-status purchase-warning" role="status"></p>
  <div class="preview-scroll" tabindex="0" aria-label="書類のプレビュー"><img class="preview-image" alt="書類のプレビュー"></div>`);
 const image=dialog.querySelector('img');
 const scroll=dialog.querySelector('.preview-scroll');
 const status=dialog.querySelector('[role="status"]');
 const prev=dialog.querySelector('[data-prev]');
 const next=dialog.querySelector('[data-next]');
 let current=1,pages=1,zoom=100;
 const showPage=()=>{
  status.textContent='';
  scroll.scrollTo(0,0);
  image.src=pdf?`${url}?page=${current}`:url;
  if(pdf){
   dialog.querySelector('[data-page]').textContent=`${current} / ${pages}`;
   prev.disabled=current===1;
   next.disabled=current===pages;
  }
 };
 const changeZoom=delta=>{
  zoom=Math.min(300,Math.max(25,zoom+delta));
  image.style.width=zoom+'%';
  dialog.querySelector('[data-zoom]').textContent=zoom+'%';
 };
 dialog.querySelector('[data-close]').onclick=()=>dialog.close();
 dialog.querySelector('[data-out]').onclick=()=>changeZoom(-25);
 dialog.querySelector('[data-in]').onclick=()=>changeZoom(25);
 image.onerror=()=>{status.textContent='書類を表示できませんでした。ログイン状態とファイルを確認してください。'};
 if(onReady)image.addEventListener('load',()=>{if(dialog.open)onReady()},{once:true});
 if(pdf){
  status.textContent='読み込み中…';
  try{
   const info=await api('GET',url+'?info=1');
   if(!dialog.open||!dialog.isConnected)return;
   pages=info.pages;
   prev.onclick=()=>{if(current>1){current--;showPage()}};
   next.onclick=()=>{if(current<pages){current++;showPage()}};
  }catch(e){
   status.textContent=e.message==='auth'?'ログインしてください':e.message;
   return;
  }
 }
 showPage();
}

function fileToB64(file){return new Promise((resolve,reject)=>{
 const reader=new FileReader();
 reader.onload=()=>resolve(String(reader.result).split(',')[1]);
 reader.onerror=()=>reject(new Error('ファイルを読み込めません'));
 reader.readAsDataURL(file);
})}
async function attachmentBody(file){
 if(!file)throw new Error('ファイルを選んでください');
 if(file.size>8*1024*1024)throw new Error('8MB以内のファイルを選択してください');
 if(file.type!=='application/pdf'&&!/\.pdf$/i.test(file.name))throw new Error('PDFを選んでください');
 return {filename:file.name,mime:'application/pdf',data:await fileToB64(file)};
}

 }
 button.disabled=true;
 try{
  if(draft){
   const manual=['unmatched','unread'].includes(draft.selection.mode);
   await api('POST',`/api/cases/${target.id}/purchase-import`,
    {...body,attachment:draft.upload,confirm_unmatched_case:manual});
   if(button.isConnected){
    if(target.id===cid)await rf();
    else location.hash='#/case/'+target.id+'/purchase';
   }
  }else{
   if(EP)await api('PUT','/api/purchases/'+EP,body);
   else await api('POST',`/api/cases/${manualCase}/purchases`,body);
   if(cid===null&&!EP)location.hash='#/case/'+manualCase+'/purchase';
   else await rf();
  }
  toast('保存しました');
 }finally{button.disabled=false}
 })}

 const check=await api('GET',`/api/cases/${id}/deletion-check`),plan=check.cancellation;
 if(!plan?.can_cancel){showDeletionReasons(plan?.reasons||check.reasons);return;}
 const message=`この案件を見送りとして削除ボックスへ移します。\n案件の下請け設定${plan.sub_count}件と依頼前の精算明細${plan.draft_line_count}件を解除します。`+(plan.hold_total?`\nこの案件への充当${Y(plan.hold_total)}は、充当元の精算で一時預かり（了承待ち）に切り替えます。利益のみ等の振込額は維持します。LINEで了承を得てから承諾日を登録してください。`:'')+'\n復元しても下請け設定や充当は自動復元されません。実行しますか？';
 if(!confirm(message))return;
 await api('POST',`/api/cases/${id}/trash`,{cancel_to_hold:true,expected_token:plan.token});
 $('#case-editor')?.close();location.hash='#/cases';toast(plan.hold_total?'見送り処理を完了し、元金を一時預かり（了承待ち）にしました':'見送り処理を完了し、下請け設定を解除しました');
})}
function restore(id){act(async()=>{await api('POST',`/api/cases/${id}/restore`);location.hash='#/case/'+id},'復元しました')}

async function viewTrash(){const l=await api('GET','/api/trash');
 page('#/trash',`<h1>削除ボックス</h1><p class="m">受けなかった案件などを入れておく場所です。管理番号は完全に削除しても再利用しません。</p><section class="card"><div id="trash-rows"></div><div class="pager" id="trash-pager"></div></section>`);
 const trashRows=items=>items.map(x=>`<div class="row"><span><b>${esc(x.mgmt_no)}</b> ${esc(x.name)}<br><span class="m">削除日時 ${esc(x.deleted_at)}</span></span><span><button class="s" onclick="restore(${x.id})">復元</button> <button class="d" onclick="purge(${x.id},'${esc(x.mgmt_no)}')">完全に削除</button></span></div>`).join('')||'<p class="m">削除ボックスは空です。</p>';
 paginate($('#trash-rows'),$('#trash-pager'),8,trashRows,'削除ボックス')(l);
}
function purge(id,no){act(async()=>{const check=await api('GET',`/api/cases/${id}/deletion-check`);if(!check.can_delete){showDeletionReasons(check.reasons);return}const t=prompt(`完全に削除すると元に戻せません。確認のため管理番号「${no}」を入力してください。`);if(t===null)return;await api('POST',`/api/cases/${id}/purge`,{confirm:t});await viewTrash();toast('完全に削除しました')})}

let settingsTab='company';
async function viewSettings(){
 const [m,migrations,pdfArchive]=await Promise.all([api('GET','/api/master'),api('GET','/api/sub-mode-migrations'),api('GET','/api/settings/pdf-archive')]);
 const c=m.company;
 const migrationRows=migrations.map(x=>`<div class="row">
  <a href="#/case/${x.case_id}">${esc(x.mgmt_no)} ${esc(x.case_name)}</a>
  <span>下請け${x.slot} ${esc(x.sub_name)} ／ ${esc(legacyTaxModes[x.tax_mode])}${x.deleted_at?' ／ 削除ボックス':''}</span></div>`).join('');
 page('#/settings',`<h1>設定</h1><div class="card"><header class="section-head"><h2>会社情報</h2></header><div class="g">${fld('会社名・屋号','co_name',c.name)}${fld('登録番号(T+13桁)','co_no',c.invoice_no)}${fld('住所','co_addr',c.address)}${fld('振込先','co_bank',c.bank_info)}</div><div class="acts"><button onclick="saveCo()">保存</button></div></div>
 <div class="card"><header class="section-head"><h2>下請けの登録</h2></header><h3 id="sub_t">下請けを追加</h3><div class="g">${fld('下請け名','m_name','')}${fld('登録番号','m_no','')}${fld('振込先','m_bank','')}${subDetailFields.map(([key,label])=>fld(label,'m_'+key,'')).join('')}</div><div class="acts"><button onclick="saveSubM()">保存</button></div></div>
 <div class="card"><h2>仕入先</h2>${m.suppliers.map(s=>`<div class="row"><span>${esc(s.name)}</span><span>${esc(s.invoice_no||'登録番号未入力')}</span></div>`).join('')}<div class="g" style="margin-top:8px">${fld('仕入先を追加','sp_name','')}${fld('登録番号（任意）','sp_no','')}</div><div class="acts"><button onclick="addSup()">追加</button></div></div>
 <div class="card"><h2>元金設定の移行対象</h2>${migrationRows||'<p class="m">移行対象はありません。</p>'}</div>
 <div class="card"><h2>パスワード</h2><div class="g">${fld('現在のパスワード','pw_cur','',{type:'password'})}${fld('新しいパスワード(8文字以上)','pw_new','',{type:'password'})}</div><div class="acts"><button onclick="chPw()">パスワードを変更</button></div></div>
 <div class="card"><h2>バックアップ・PDF保存先</h2><p>読込PDFは案件が分かるファイル名に整え、発行PDFは書類番号のファイル名で保存します。PDFは保存先の直下にまとめます。原本・旧版はアプリ内で保管します。</p>
 ${fld('PDFコピー保存先（絶対パス、空欄で既定）','pdf-archive-directory',pdfArchive.directory)}
 <p class="m" style="overflow-wrap:anywhere">有効な保存先：${esc(pdfArchive.effective_directory)}</p>
 ${pdfArchive.environment_override?'<p class="m">環境変数 LOGIBOX_PDF_DIR が優先されています。画面の保存値を使うには環境変数を解除して再起動してください。</p>':''}
 ${pdfArchive.error?`<p role="alert" style="overflow-wrap:anywhere">${esc(pdfArchive.error)}</p>`:''}
 <div class="acts"><button class="s" onclick="act(savePdfArchiveSettings,'PDF保存先を保存し、コピーを再試行しました')">保存してPDFコピーを再実行</button><button class="s" onclick="downloadFile('/api/backup/full')">添付書類を含む全体バックアップ（ZIP）</button><button class="s" onclick="downloadFile('/api/backup')">DBのみバックアップ</button></div></div>`);
 window.SUBS=m.subs;
 ES=null;
 addCompanyFields(c);
 arrangeSettings();
 simplifySettings(migrations.length);
 if(c.seal_png){
  const seal=document.createElement('div');
  seal.className='company-seal';
  seal.innerHTML='<img alt="会社の社印"><div><h3>登録済みの社印</h3><p class="m">新しく発行する請求書・領収書に反映します。</p></div>';
  seal.querySelector('img').src='data:image/png;base64,'+c.seal_png;
  $('#settings-panel-company').append(seal);
 }
 if(c.bundled_seal_available){
  const restore=document.createElement('div');
  restore.className='acts';
  restore.innerHTML='<button class="s" onclick="restoreCompanySeal()">同梱の社印を復元</button><p class="m">変更前に自動バックアップします。案件・会社情報・パスワードは保持します。</p>';
  $('#settings-panel-company').append(restore);
 }
}
function arrangeSettings(){
 const main=$('.workspace main');
 const wrapper=document.createElement('div');
 wrapper.className='settings-page';
 wrapper.append(...main.children);
 main.append(wrapper);
 const tabs=[['company','会社情報'],['subs','下請け登録'],['suppliers','仕入先'],['migration','元金設定'],['password','パスワード'],['backup','バックアップ']];
 const heading=wrapper.querySelector('h1');
 heading.insertAdjacentHTML('afterend','<div class="settings-tabs" role="tablist" aria-label="設定メニュー"></div>');
 const bar=wrapper.querySelector('.settings-tabs');
 const cards=[...wrapper.querySelectorAll(':scope > .card')];
 tabs.forEach(([key,label],index)=>{
  const button=document.createElement('button');
  button.type='button';button.id='settings-tab-'+key;button.textContent=label;
  button.setAttribute('role','tab');button.setAttribute('aria-controls','settings-panel-'+key);
  button.onclick=()=>selectSettingsTab(key);
  bar.append(button);
  cards[index].id='settings-panel-'+key;
  cards[index].setAttribute('role','tabpanel');
  cards[index].setAttribute('aria-labelledby',button.id);
 });
 bar.onkeydown=event=>{
  const buttons=[...bar.children].filter(button=>!button.hidden),index=buttons.indexOf(event.target);
  if(index<0||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
  event.preventDefault();
  const next=event.key==='Home'?0:event.key==='End'?buttons.length-1:(index+(event.key==='ArrowLeft'?-1:1)+buttons.length)%buttons.length;
  buttons[next].click();buttons[next].focus();
 };
 $('#co_bank').outerHTML=`<textarea id="co_bank" rows="3">${esc($('#co_bank').value)}</textarea>`;
 $('#m_bank').outerHTML='<textarea id="m_bank" rows="2"></textarea>';
 $('#m_bank').closest('.f').firstChild.textContent='以前に登録した振込先（分割入力で更新）';
 $('#m_bank').closest('.f').hidden=true;
 const card=cards[1], editor=document.createElement('section');
 editor.className='sub-editor';
 let node=$('#sub_t');
 while(node){const next=node.nextSibling;editor.append(node);node=next}
 card.append(editor);
 const list=document.createElement('div');
 list.className='sub-list';
 const table=document.createElement('div');
 table.className='table-scroll';
 table.innerHTML=`<table class="data-table compact-table"><thead><tr><th>下請け名</th><th>登録番号</th><th>住所</th><th>電話番号</th><th></th></tr></thead><tbody></tbody></table>${window.SUBS.length?'':'<p class="m">登録済みの下請けはありません。</p>'}`;
 const pager=document.createElement('div');pager.className='pager';
 list.append(table,pager);
 card.insertBefore(list,editor);
 const subRows=items=>items.map(sub=>`<tr><td>${esc(sub.name)}</td><td>${esc(sub.invoice_no||'未入力')}</td><td>${esc(sub.address||'未入力')}</td><td>${esc(sub.phone||'未入力')}</td><td><button class="s" onclick="editSub(${sub.id})">会社情報を編集</button></td></tr>`).join('');
 paginate(table.querySelector('tbody'),pager,6,subRows,'下請け登録')(window.SUBS);
 const add=document.createElement('button');
 add.className='s';add.textContent='下請けを追加';
 add.onclick=()=>resetSubEditor(true);
 card.querySelector('.section-head').append(add);
 editor.querySelector('button').textContent='下請け情報を保存';
 editor.querySelector('.acts').insertAdjacentHTML('beforeend','<button class="s" onclick="resetSubEditor(false)">閉じる</button>');
 editor.hidden=true;
 selectSettingsTab(settingsTab);
}
function selectSettingsTab(key){
 settingsTab=key;
 for(const button of document.querySelectorAll('.settings-tabs button')){
  const selected=button.id==='settings-tab-'+key;
  button.setAttribute('aria-selected',String(selected));button.tabIndex=selected?0:-1;
  document.getElementById(button.getAttribute('aria-controls')).hidden=!selected;
 }
}
function resetSubEditor(show){
 ES=null;
 $('#sub_t').textContent='下請けの会社情報を登録';
 for(const id of ['m_name','m_no','m_bank'])document.getElementById(id).value='';
 for(const [key] of subDetailFields)document.getElementById('m_'+key).value='';
 showSubEditor(show);
}
function showSubEditor(show){
 $('.sub-editor').hidden=!show;
 $('.sub-list').hidden=show;
 if(show)$('#m_name').focus();
 else $('#settings-panel-subs .section-head button').focus();
}
const subDetailFields=[['postal_code','郵便番号'],['address','住所'],['phone','電話番号'],['email','メールアドレス（任意）'],['contact_name','担当者'],['bank_name','銀行名'],['bank_branch','支店名'],['account_type','口座種別'],['account_number','口座番号'],['account_holder','口座名義']];
let ES=null;
function addCompanyFields(company){
 const grid=$('#co_name').closest('.g');
 const type=company.invoice_type||'';
 const fields=[
  fld('請求書の種類','co_invoice_type','',{sel:'<option value="">未設定</option><option value="qualified">適格請求書（登録番号必須）</option><option value="standard">通常の請求書</option>'}),
  fld('郵便番号','co_postal_code',company.postal_code),
  fld('電話番号','co_phone',company.phone),
  fld('メールアドレス（任意）','co_email',company.email,{type:'email'}),
  fld('担当者','co_contact_name',company.contact_name),
  fld('銀行・支店','co_bank_branch',company.bank_branch),
  fld('口座種別・番号','co_bank_account',company.bank_account),
  fld('口座名義','co_bank_holder',company.bank_holder)
 ];
 grid.insertAdjacentHTML('beforeend',fields.join(''));
 $('#co_invoice_type').value=type;
 for(const id of ['co_name','co_invoice_type','co_no','co_postal_code','co_addr','co_phone','co_email','co_contact_name','co_bank_branch','co_bank_account','co_bank_holder','co_bank'])grid.append(document.getElementById(id).closest('.f'));
 const legacy=$('#co_bank').closest('.f');
 legacy.hidden=true;
 legacy.firstChild.textContent='以前に登録した振込先（分割入力すると置き換え）';
}
function saveCo(){act(async()=>{
 const body={name:G('co_name'),invoice_no:G('co_no'),address:G('co_addr'),bank_info:G('co_bank')};
 for(const key of ['invoice_type','postal_code','phone','email','contact_name','bank_branch','bank_account','bank_holder'])body[key]=G('co_'+key);
 await api('PUT','/api/company',body);await viewSettings();
},'保存しました')}
function editSub(id){const s=window.SUBS.find(x=>x.id===id);ES=id;$('#sub_t').textContent='下請けの会社情報を編集';m_name.value=s.name;m_no.value=s.invoice_no||'';m_bank.value=s.bank_info||'';for(const [key] of subDetailFields)document.getElementById('m_'+key).value=s[key]||'';showSubEditor(true)}
function saveSubM(){act(async()=>{const b={name:G('m_name'),invoice_no:G('m_no'),bank_info:G('m_bank')};for(const [key] of subDetailFields)b[key]=G('m_'+key);if(ES)await api('PUT','/api/subcontractors/'+ES,b);else await api('POST','/api/subcontractors',b);ES=null;await viewSettings()},'保存しました')}
function addSup(){act(async()=>{await api('POST','/api/suppliers',{name:G('sp_name'),invoice_no:G('sp_no')});await viewSettings()},'追加しました')}
function restoreCompanySeal(){if(!confirm('同梱されている社印を登録します。登録済みの場合は置き換わります。新しく発行・再発行する帳票に反映されます。よろしいですか？'))return;act(async()=>{await api('POST','/api/company/seal/restore',{confirmed:true});await viewSettings()},'社印を復元しました')}
function chPw(){act(async()=>{await api('POST','/api/password',{current:G('pw_cur'),new:G('pw_new')});await boot()},'パスワードを変更しました。新しいパスワードでログインしてください')}
boot();
</script></body></html>
